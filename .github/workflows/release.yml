# The release of the Kotlin libraries (cloud.wordplus:realtime, realtime-calls, realtime-ui, and the Gradle plugin
# cloud.wordplus.realtime-ui from realtime-ui-tools): a tag vX.Y.Z, pushed by WordPlus's publish script with the release's
# files, tests the core, publishes each build to Maven Central signed, released at once, then makes the GitHub release.
# The Gradle Plugin Portal hands Maven Central's artifacts on, so `id("cloud.wordplus.realtime-ui")` resolves from there.
# The room client under the calls (cloud.wordplus:rtc-client-android, rtc-client/) goes first, at its own version,
# unless Maven Central has that version already.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      # The Central Portal's user token, and the key the artifacts are signed with (ASCII-armoured, with its password).
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: The core tests
        run: ./gradlew test --console=plain

      - name: Maven Central
        run: |
          client=$(cat vendor/rtc-client-android/VERSION)
          if curl -sfI "https://repo1.maven.org/maven2/cloud/wordplus/rtc-client-android/$client/rtc-client-android-$client.pom" > /dev/null; then
            echo "cloud.wordplus:rtc-client-android:$client is on Maven Central already"
          else
            (cd rtc-client && ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --console=plain)
          fi
          for build in . calls ui ui-tools; do
            (cd "$build" && ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --console=plain)
          done

      - name: The GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "cloud.wordplus:realtime ${GITHUB_REF_NAME#v}, realtime-calls, realtime-ui and the Gradle plugin cloud.wordplus.realtime-ui, on Maven Central"
